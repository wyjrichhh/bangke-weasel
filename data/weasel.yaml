# Bangke settings (file name kept for user-config compatibility)
# encoding: utf-8

# 配色方案、布局度量与 macOS 版 data/bangke.yaml 保持一致;
# 色值为 Rime 惯例 0xBBGGRR / 0xAABBGGRR,color_format: abgr。
config_version: "0.25"

app_options:
  cmd.exe:
    ascii_mode: true
  conhost.exe:
    ascii_mode: true

show_notifications: false  # 部署/切方案 tips 关闭,反馈走设置内 toast
# how long a period notifications shows
show_notifications_time: 1200
# use global ascii status
global_ascii: false

style:
  antialias_mode: default
  ascii_tip_follow_cursor: false
  color_scheme: native
  #color_scheme_dark: solarized_dark
  font_face: "Segoe UI, Microsoft YaHei"
  label_font_face: "Segoe UI, Microsoft YaHei"
  comment_font_face: "Segoe UI, Microsoft YaHei"
  font_point: 16
  label_font_point: 16
  # 0 = 隐藏拼音注释;AI 标记在面板层豁免,不受此开关影响
  comment_font_point: 16
  # 整窗不透明度(mac style/alpha),乘到面板各背景色
  alpha: 1.0
  candidate_abbreviate_length: 0
  click_to_capture: false
  horizontal: false
  fullscreen: false
  inline_preedit: true
  preedit_type: composition
  display_tray_icon: false
  label_format: "%s."
  mark_text: ""
  hover_type: none
  paging_on_scroll: false
  vertical_auto_reverse: false
  vertical_text: false
  vertical_text_left_to_right: false
  vertical_text_with_wrap: false
  layout:
    align_type: center
    max_width: 0  #set 0 to disable max width
    min_width: 0
    min_height: 0
    max_height: 0  #set 0 to disable max height
    # mac border_width: -2 → borderLineWidth <= 0,不画边框线;
    # 方案内 border_color 存在也不画,与 mac 一致
    border_width: 0
    # mac edgeInset = border_width + corner_radius = 5;
    # margin_x 0 + hilite_padding_x 5 经引擎 fixup 后 margin_x = 5,
    # 高亮矩形外扩至面板左右边缘(满铺),文字仍缩进 5。
    # 高亮纵向顶满面板:padding_y = margin_y(5) → 高亮矩形恰好触到
    # 面板上下缘,_SnapHighlightToPanel 贴边(圆角取面板半径)。
    # fixup 使 spacing/candidate_spacing = max(现值, padding_y*2)=10,
    # 多行时高亮块纵向相连(mac 实拍同观感:行间无缝、无灰底露出)
    # 内容边距 ≥ 圆角半径(mac carveInset = radius+border):否则
    # 末行序号/首尾行文字被面板圆角弧线挤出面板边缘
    margin_x: 9
    margin_y: 9
    spacing: 10
    candidate_spacing: 10
    hilite_spacing: 5
    hilite_padding: 0
    hilite_padding_x: 9
    hilite_padding_y: 5
    # 高亮圆角。贴面板边的角由引擎换成面板圆角(snap);拼音行下方的
    # 第一候选直角(StandardLayout 圆角表 VERTICAL+非内联+首行全直角)
    round_corner: 7
    # mac 的 7 是 pt(≈9.3 逻辑像素),weasel 单位是像素,直译会小 1/3 显「方」
    corner_radius: 9
    # mac NSPanel 自带系统窗影;Windows 侧用小半径软影近似
    # (shadow_color 引擎兜底 20% 黑,方案未带 shadow_color 也生效)
    shadow_radius: 2
    shadow_offset_x: 0
    shadow_offset_y: 1
    linespacing: 0 # percentage of font point, 0 to disable
    baseline: 0 # percentage of font point, 0 to disable

# 方案色值与 macOS 版逐字一致;除颜色外仅 label/comment 字体键被读取,
